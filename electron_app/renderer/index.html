<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrugLit Summarizer - Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="menu-toggle" aria-label="Toggle menu">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </button>

    <nav id="sidebar">
        <h2>Menu</h2>
        <div id="recent-searches-container">
            <div id="recent-searches"></div>
        </div>
        <div class="theme-switch-wrapper">
            <button id="theme-toggle-button" aria-label="Toggle theme">
                <span id="theme-icon"></span>
            </button>
            <em><span id="theme-mode-text"></span></em>
        </div>
    </nav>

    <div id="overlay"></div>

    <main id="main-content">
        <h1>DrugLit Summarizer 💊</h1>
        <div class="search-container">
            <input type="text" id="drug-input" placeholder="약물 이름을 영어로 입력하세요 (예: Aspirin)">
            <button id="search-button">논문 요약 검색</button>
        </div>
        <div id="loading">
            <p>PubMed에서 논문을 검색하고 요약하는 중입니다... 잠시만 기다려주세요.</p>
        </div>
        <div id="results-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
