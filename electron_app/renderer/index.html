<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrugLit Summarizer - Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="menu-toggle" aria-label="Toggle menu">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </button>

    <nav id="sidebar">
        <h2>Menu</h2>
        <div id="recent-searches-container">
            <div id="recent-searches"></div>
        </div>

        <!-- PDF 내보내기 버튼 컨테이너 (사이드바 내부로 이동) -->
        <div id="export-container" style="display: none;">
            <button id="export-pdf-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                <span>결과 PDF로 저장</span>
            </button>
        </div>
        
        <div class="theme-switch-wrapper">
            <button id="theme-toggle-button" aria-label="Toggle theme">
                <span id="theme-icon"></span>
            </button>
            <em><span id="theme-mode-text"></span></em>
        </div>
    </nav>

    <div id="overlay"></div>

    <main id="main-content">
        <h1>DrugLit Summarizer 💊</h1>
        <div class="search-container">
            <input type="text" id="drug-input" placeholder="약물 이름을 영어로 입력하세요 (예: Aspirin)">
            <button id="search-button">논문 요약 검색</button>
        </div>
        <div id="loading">
            <p>PubMed에서 논문을 검색하고 요약하는 중입니다... 잠시만 기다려주세요.</p>
        </div>
        <div id="results-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
